<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Competitor Post Radar</title>
  <style>
    body {
      width: 380px;
      max-height: 560px;
      overflow-y: auto;
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 13px;
      color: #151b1f;
      background: #fff;
    }
    header { padding: 12px 14px; border-bottom: 1px solid #e2e6e3; }
    header h1 { font-size: 14px; margin: 0; }
    header p { margin: 2px 0 0; color: #6b7570; font-size: 12px; }
    main { padding: 12px 14px; }
    .row { display: flex; gap: 8px; margin-bottom: 8px; }
    .row input, .row select { flex: 1; padding: 5px 7px; border: 1px solid #d8ded9; border-radius: 5px; font-size: 12.5px; }
    button {
      width: 100%; padding: 9px; border-radius: 6px; border: 1px solid #b8790e;
      background: #b8790e; color: #2a1b00; font-weight: 600; cursor: pointer; font-size: 13px;
    }
    button.secondary { background: #f4f7f5; border-color: #d8ded9; color: #151b1f; margin-top: 6px; }
    button:disabled { opacity: .5; cursor: default; }
    .status { margin-top: 8px; font-size: 12px; color: #6b7570; min-height: 16px; }
    .post-item {
      border: 1px solid #e2e6e3; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px;
    }
    .post-item .snippet { font-size: 12px; margin: 4px 0 6px; max-height: 54px; overflow: hidden; }
    .post-item .counts { display: flex; gap: 6px; }
    .post-item .counts input { width: 100%; padding: 4px; font-size: 12px; border: 1px solid #d8ded9; border-radius: 4px; }
    .post-item label { font-size: 10px; text-transform: uppercase; color: #8b958f; display: block; margin-bottom: 2px; }
    .post-item .top-row { display: flex; justify-content: space-between; align-items: center; }
    .empty { color: #8b958f; text-align: center; padding: 20px 0; }
    a.opts-link { display: block; text-align: center; margin-top: 10px; font-size: 11.5px; color: #1e6e68; }
  </style>
</head>
<body>
  <header>
    <h1>Competitor Post Radar</h1>
    <p>Scan this profile, review the numbers, log it.</p>
  </header>
  <main>
    <div class="row">
      <input id="competitor-name" type="text" placeholder="Competitor name" />
    </div>
    <div class="row">
      <input id="list-name" type="text" placeholder="List (e.g. Direct competitors)" />
    </div>
    <button id="scan-btn">Scan this page</button>
    <div id="status" class="status"></div>
    <div id="results"></div>
    <button id="log-btn" class="secondary hidden" style="display:none;">Log selected posts</button>
    <a class="opts-link" href="#" id="open-options">Settings (API URL &amp; token)</a>
  </main>
  <script src="popup.js"></script>
</body>
</html>
